<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A tour of Motion Director</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../kit/player.css">
<link rel="stylesheet" href="../../kit/stage.css">
<style>
/* The tour: Motion Director's studio, rebuilt from app/src (1600 × 900 native px), and Claude's chat docked beside
 * it on a pale stage. Every step runs the comment loop: point at it, Enter, Claude picks it up and edits.
 * Step titles land in the middle of the frame over a pale veil, then swish out as the UI takes over. */
#stage { --font-ui: 'Host Grotesk', 'Helvetica Neue', Arial, sans-serif; --font-display: var(--font-ui); background: #F3F2EE; }
#dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(28,31,36,.07) 1.4px, transparent 1.6px); background-size: 28px 28px; }
#world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
#veil { position: absolute; inset: 0; background: #F3F2EE; }

/* step titles: a small step label over one line in the middle of the frame */
#stepT { position: absolute; left: 0; top: 0; width: 1920px; display: flex; flex-direction: column; align-items: center; font-family: var(--font-ui); color: #1C1F24; }
#stepT .k { display: inline-block; font: 600 26px/1 var(--font-ui); letter-spacing: .02em; padding: 10px 18px; border-radius: 999px; background: #1C1F24; color: #F3F2EE; margin-bottom: 26px; }
#stepT .m { transform-origin: 0 0; font-weight: 600; font-size: 96px; line-height: 1.04; letter-spacing: -.035em; white-space: nowrap; }
#stepT .m span { display: inline-block; }
#stepT .m span:last-child { margin-right: 0; }

/* ── the studio (app/src: TopBar, VibeTab, TreatmentTab, EditTab, ExportTab, CommentBox), native px ── */
#studio { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; overflow: hidden; border-radius: 16px;
  --bg: #0e0e10; --card: #161618; --pop: #1c1c1f; --sec: #232326; --acc: #2a2a2e; --fg: #ececee; --mu: #9d9da6; --bd: rgba(255,255,255,.09); --in: rgba(255,255,255,.14);
  --warn: #e8952e; --ok: #3ccf7f; --bad: #ef5b4b; --d1: #e8952e; --d2: #4fc9bc; --d3: #b99af0; --d4: #e6bf4e; --d5: #78a9f5;
  background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-ui); box-shadow: 0 40px 100px -30px rgba(20,22,28,.45), 0 8px 30px -12px rgba(20,22,28,.25); }
#studio * { box-sizing: border-box; }
.a { position: absolute; }
.bar { left: 0; top: 0; width: 1600px; height: 64px; border-bottom: 1px solid var(--bd); }
.brand { left: 20px; top: 19px; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.tab { top: 20px; font-size: 16px; color: var(--mu); text-align: center; }
.tab.on { color: var(--fg); }
.uline { top: 61px; height: 2px; background: var(--fg); border-radius: 1px; }
.crumbs { left: 0; width: 1600px; top: 21px; text-align: center; color: var(--mu); font-size: 15px; }
.crumbs b { color: var(--fg); font-weight: 600; }
.slink { left: 1352px; top: 15px; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--mu); }
.slink svg { width: 18px; height: 18px; }
.chev { left: 1544px; top: 15px; height: 34px; min-width: 40px; border-radius: 8px; background: var(--sec); border: 1px solid var(--bd); display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 9px; }
.chev svg { width: 15px; height: 15px; }
.chev .n { min-width: 20px; height: 20px; border-radius: 10px; background: var(--warn); color: #2a1600; font: 600 12px/20px var(--font-ui); text-align: center; padding: 0 5px; }
.cbtn { left: 1396px; top: 15px; height: 34px; width: 140px; border-radius: 8px; background: var(--sec); border: 1px solid var(--bd); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; }
.cbtn.on { background: var(--fg); color: #111113; }
.cbtn kbd { font: 600 11px/1 var(--font-ui); border: 1px solid var(--in); border-radius: 4px; padding: 2px 5px; color: inherit; opacity: .7; }
.cbtn svg { width: 16px; height: 16px; }
.pane { left: 0; top: 64px; width: 1600px; height: 836px; }
.card { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; }
.lab { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mu); }
.inp { height: 34px; border-radius: 8px; border: 1px solid var(--in); background: transparent; color: var(--mu); font-size: 14px; padding: 7px 12px; }
.btn { height: 34px; border-radius: 8px; border: 1px solid var(--bd); background: var(--sec); font-size: 14px; font-weight: 600; padding: 7px 14px; white-space: nowrap; }
.btn.pri { background: var(--fg); color: #111113; border-color: transparent; }

/* vibe */
.pin { width: 372px; padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.pin .take { font-size: 14px; line-height: 1.45; color: var(--fg); }
.pin .meta { font-size: 12px; color: var(--mu); }
.thumb { border-radius: 9px; overflow: hidden; position: relative; }
.play { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(255,255,255,.92); display: grid; place-items: center; }
.play::after { content: ''; border: 11px solid transparent; border-left: 17px solid #111; border-right: 0; margin-left: 5px; }
.sw { display: flex; height: 92px; border-radius: 9px; overflow: hidden; }
.sw i { flex: 1; }
.aa { font-size: 64px; font-weight: 600; letter-spacing: -.03em; line-height: 1; }
.dropzone { border: 2px dashed rgba(236,236,238,.35); border-radius: 14px; }

/* treatment */
.doc h1 { margin: 0; font-size: 40px; font-weight: 600; letter-spacing: -.025em; }
.trow { left: 32px; width: 1100px; height: 222px; border-radius: 14px; }
.trow .t { position: absolute; left: 20px; top: 22px; width: 520px; }
.chip { display: inline-block; font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--sec); color: var(--mu); font-variant-numeric: tabular-nums; }
.trow h3 { margin: 12px 0 6px; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.trow p { margin: 0; color: var(--mu); font-size: 16px; line-height: 1.5; }
.frame { position: absolute; left: 640px; top: 3px; width: 384px; height: 216px; border-radius: 8px; overflow: hidden; }

/* the film being edited, "Hello, motion." (960 × 540) */
.film { position: absolute; left: 0; top: 0; width: 960px; height: 540px; transform-origin: 0 0; background: #FAFAF7; overflow: hidden; }
.f-head { position: absolute; left: 70px; top: 64px; font-family: var(--font-ui); font-size: 76px; letter-spacing: -.035em; line-height: 1; color: #1C1F24; white-space: nowrap; }
.f-head span { display: inline-block; margin-right: .2em; }
.f-floor { position: absolute; left: 70px; right: 70px; top: 440px; height: 3px; border-radius: 2px; background: rgba(28,31,36,.14); }
.f-ball { position: absolute; left: 0; top: 0; width: 90px; height: 90px; border-radius: 50%; background: #63D3E6; transform-origin: 50% 100%; }
.f-shadow { position: absolute; left: 0; top: 0; width: 90px; height: 14px; border-radius: 50%; background: rgba(28,31,36,.14); }
.f-ring { position: absolute; left: 0; top: 0; width: 160px; height: 40px; margin: -20px 0 0 -80px; border-radius: 50%; border: 4px solid #63D3E6; }
.f-tile { position: absolute; left: 0; top: 0; width: 120px; height: 120px; border-radius: 22px; background: #EF6B57; transform-origin: 50% 100%; }
.f-pill { position: absolute; left: 0; top: 0; width: 230px; height: 70px; border-radius: 999px; background: #B9A9F5; }
.f-tri { position: absolute; left: 0; top: 0; width: 100px; height: 92px; transform-origin: 50% 100%; }

/* edit */
.lib { left: 0; top: 0; width: 290px; height: 836px; border-right: 1px solid var(--bd); }
.fam { left: 14px; width: 262px; height: 30px; display: flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--fg); }
.fam small { margin-left: auto; color: var(--mu); font-size: 13px; letter-spacing: 0; }
.fam i { font-style: normal; color: var(--mu); width: 10px; }
.srow { left: 14px; width: 262px; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 7px; font-size: 14px; }
.srow .pl { width: 20px; height: 20px; border-radius: 50%; background: var(--sec); display: grid; place-items: center; flex: none; }
.srow .pl::after { content: ''; border: 4px solid transparent; border-left: 6px solid var(--fg); border-right: 0; margin-left: 2px; }
.srow small { margin-left: auto; color: var(--mu); font-size: 12px; font-variant-numeric: tabular-nums; }
.srow.hot { background: var(--acc); }
.prev { left: 290px; top: 0; width: 1000px; height: 456px; background: var(--bg); }
.vbar { left: 290px; top: 416px; width: 1000px; height: 40px; border-top: 1px solid var(--bd); display: flex; align-items: center; gap: 14px; padding: 0 14px; font-size: 13px; color: var(--mu); }
.tl { left: 290px; top: 456px; width: 1000px; height: 380px; background: var(--card); border-top: 1px solid var(--bd); overflow: hidden; }
.trk { left: 0; width: 1000px; border-bottom: 1px solid var(--bd); }
.gut { position: absolute; left: 0; top: 0; bottom: 0; width: 150px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 13px; color: var(--mu); border-right: 1px solid var(--bd); background: var(--card); z-index: 2; }
.pbtn { width: 26px; height: 26px; border-radius: 50%; background: var(--fg); display: grid; place-items: center; flex: none; }
.pbtn::after { content: ''; border: 5px solid transparent; border-left: 8px solid #111; border-right: 0; margin-left: 2px; }
.clock { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.tick { position: absolute; bottom: 0; width: 1px; height: 6px; background: var(--in); }
.tick.mj { height: 11px; background: var(--mu); }
.tick span { position: absolute; bottom: 12px; left: 3px; font-size: 12px; color: var(--mu); }
.beat { position: absolute; top: 5px; font-size: 12px; color: var(--fg); white-space: nowrap; display: flex; align-items: center; gap: 5px; }
.beat::before { content: ''; border: 5px solid transparent; border-left: 7px solid var(--fg); border-right: 0; }
.omini { position: absolute; top: 6px; height: 18px; border-radius: 4px; border: 1px solid var(--o); background: color-mix(in srgb, var(--o) 24%, transparent); }
.clip { position: absolute; top: 5px; height: 30px; border-radius: 6px; border: 1px solid rgba(236,236,238,.45); background: rgba(236,236,238,.12); overflow: hidden; }
.clip .cn { position: absolute; left: 6px; top: 3px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.clip .hm { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--warn); }
.clip.obj { border-color: color-mix(in srgb, var(--d2) 80%, transparent); background: color-mix(in srgb, var(--d2) 22%, transparent); }
.clip.fly { z-index: 6; box-shadow: 0 10px 24px -8px rgba(0,0,0,.7); }
.head { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--bad); z-index: 4; }
.objh { background: color-mix(in srgb, var(--d2) 10%, transparent); }
.objh .gut { color: var(--d2); font-weight: 600; }
.mk { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 3px rgba(232,149,46,.25); }
.guide { position: absolute; width: 0; border-left: 1.5px dashed var(--warn); z-index: 3; }
.insp { left: 1290px; top: 0; width: 310px; height: 836px; border-left: 1px solid var(--bd); padding: 18px 16px; }
.insp h2 { margin: 0; font-size: 18px; font-weight: 600; }
.insp .sub { color: var(--mu); font-size: 14px; }
.snd { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--bd); border-radius: 9px; padding: 7px 10px; font-size: 13px; margin-top: 8px; }
.snd b { color: var(--warn); font-weight: 600; }
.toast { left: 452px; top: 760px; padding: 8px 14px; border-radius: 9px; background: var(--pop); border: 1px solid var(--bd); font-size: 14px; box-shadow: 0 12px 30px -10px rgba(0,0,0,.6); white-space: nowrap; z-index: 9; }

/* over the preview: the picker, the selection, and the comment box with its copied badges */
.pick { border: 2px solid var(--fg); border-radius: 4px; background: rgba(236,236,238,.10); z-index: 7; }
.pick .tag { position: absolute; left: -2px; bottom: 100%; margin-bottom: 5px; background: var(--fg); color: #111113; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
.sel { border: 2px solid var(--d2); border-radius: 4px; z-index: 6; }
.cbox { width: 340px; border-radius: 12px; border: 1px solid var(--bd); background: var(--pop); padding: 12px; box-shadow: 0 24px 50px -16px rgba(0,0,0,.75); z-index: 8; display: grid; gap: 10px; }
.cbox .ct { font-size: 14px; font-weight: 600; }
.cbox .ta { min-height: 64px; border-radius: 8px; border: 1px solid var(--in); padding: 8px 10px; font-size: 15px; }
.cbox .hint { font-size: 12px; color: var(--mu); }
.badge { display: flex; width: fit-content; align-items: center; gap: 8px; border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
.badge.ok { background: var(--ok); color: #08210f; }
.badge.next { background: var(--warn); color: #2a1600; }
.badge kbd { font: 600 11px/1 var(--font-ui); border: 1px solid rgba(42,22,0,.4); border-radius: 4px; padding: 2px 5px; }
.lbar { height: 2px; border-radius: 1px; background: var(--bd); overflow: hidden; }
.lbar i { display: block; height: 100%; background: rgba(236,236,238,.5); transform-origin: 0 0; }
.caret { display: inline-block; width: 2px; height: 18px; background: var(--fg); vertical-align: -3px; margin-left: 1px; }

/* export */
.note { border-radius: 10px; padding: 12px 14px; font-size: 15px; line-height: 1.5; }
.note.warn { background: rgba(232,149,46,.1); border: 1px solid rgba(232,149,46,.35); color: #f2c58f; }
.note.ok { background: rgba(60,207,127,.1); border: 1px solid rgba(60,207,127,.35); color: #9be6bb; }
.note code { font: 13px/1.6 ui-monospace, Menlo, monospace; color: var(--fg); }
.fmt { border: 1px solid var(--bd); border-radius: 10px; padding: 12px; display: flex; gap: 12px; }
.fmt.on { border-color: var(--fg); }
.radio { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--mu); flex: none; margin-top: 3px; position: relative; }
.fmt.on .radio { border-color: var(--fg); }
.fmt.on .radio::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--fg); }
.fmt b { display: block; font-weight: 600; }
.fmt span { font-size: 14px; color: var(--mu); }
.tog { display: flex; border: 1px solid var(--in); border-radius: 8px; overflow: hidden; width: fit-content; }
.tog span { padding: 6px 18px; font-size: 14px; border-right: 1px solid var(--in); }
.tog span:last-child { border-right: 0; }
.tog span.on { background: var(--acc); }
.prog { height: 6px; border-radius: 3px; background: var(--sec); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--fg); transform-origin: 0 0; }

/* Claude's chat, beside the studio */
#chat { position: absolute; left: 0; top: 0; width: 442px; height: 774px; border-radius: 18px; background: #FAF9F5; color: #1C1F24; overflow: hidden; font: 17px/1.45 var(--font-ui);
  box-shadow: 0 40px 100px -30px rgba(20,22,28,.5), 0 6px 24px -10px rgba(20,22,28,.3); }
.ch-top { position: absolute; left: 0; right: 0; top: 0; height: 58px; font-size: 19px; border-bottom: 1px solid rgba(28,31,36,.1); display: flex; align-items: center; gap: 10px; padding: 0 20px; font-weight: 600; }
.spark { width: 22px; height: 22px; }
.ch-msgs { position: absolute; left: 0; right: 0; top: 58px; bottom: 96px; padding: 20px; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; }
.ch-u { align-self: flex-end; max-width: 94%; background: #EDEBE4; border-radius: 14px; padding: 12px 16px; font-size: 17px; line-height: 1.45; }
.ch-u p { margin: 0; }
.ch-u b { font-weight: 600; }
/* a note that arrived from the studio by itself, not typed here */
.ch-n { background: #FFFFFF; border: 1px solid rgba(28,31,36,.14); box-shadow: 0 6px 18px -10px rgba(20,22,28,.35); }
.from { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #8A8679; margin-bottom: 6px; }
.from svg { width: 15px; height: 15px; }
.ch-a { max-width: 96%; font-size: 20px; line-height: 1.4; }
.ch-a .work, .work { color: #8A8679; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.ch-cmp { position: absolute; left: 16px; right: 16px; bottom: 16px; height: 64px; border-radius: 14px; border: 1px solid rgba(28,31,36,.2); background: #FFFFFF; display: flex; align-items: center; padding: 0 12px 0 16px; font-size: 18px; gap: 10px; }
.ch-cmp .tx { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch-cmp .ph { color: #8A8679; }
.ch-send { width: 36px; height: 36px; border-radius: 10px; background: #D97757; display: grid; place-items: center; flex: none; }
.ch-send svg { width: 18px; height: 18px; fill: none; stroke: #FFF; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.ccaret { display: inline-block; width: 2px; height: 20px; background: #1C1F24; vertical-align: -4px; margin-left: 1px; }

/* the screenshot dragged onto the vibe board, and the finished file */
#file { position: absolute; left: 0; top: 0; width: 230px; padding: 10px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 24px 50px -18px rgba(20,22,28,.5); font: 600 14px/1.3 var(--font-ui); color: #1C1F24; text-align: center; }
.shot { position: relative; height: 130px; border-radius: 8px; background: #F1EEE6; overflow: hidden; }
.shot i { position: absolute; left: 22%; top: 22%; width: 56%; height: 52%; border-radius: 12px; background: #FFFFFF; box-shadow: 0 8px 26px rgba(0,0,0,.12); }
.shot b { position: absolute; left: 30%; top: 34%; width: 30%; height: 7%; border-radius: 4px; background: #E3DED2; }
.shot u { position: absolute; left: 30%; top: 48%; width: 40%; height: 7%; border-radius: 4px; background: #EEEAE0; }
#final { position: absolute; left: 0; top: 0; width: 960px; height: 540px; transform-origin: 0 0; overflow: hidden; }

/* the pointer: an arrow, or comment mode's speech bubble whose point is the click point */
#cursor { position: absolute; left: 0; top: 0; width: 34px; height: 34px; z-index: 20; }
#cursor svg { position: absolute; left: 0; top: 0; width: 34px; height: 34px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.3)); }
.ripple { position: absolute; left: 0; top: 0; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 3px solid #ececee; z-index: 19; }
.keycap { position: absolute; left: 0; top: 0; padding: 8px 14px; border-radius: 10px; background: #1C1F24; color: #FAF9F5; font: 600 22px/1 var(--font-ui); box-shadow: 0 10px 24px -8px rgba(0,0,0,.5); z-index: 21; }
</style>
</head>
<body>
<main id="player" data-title="A tour of Motion Director">
  <div id="stage">
    <div class="layer" id="dots"></div>
    <div id="world">
      <div id="studio"></div>
      <div id="chat"></div>
      <div id="file"><div class="shot"><i></i><b></b><u></u></div><div style="margin-top:8px">soft-shadow.png</div></div>
      <div class="ripple" id="ripple"></div>
      <div id="cursor"><svg class="arr" viewBox="0 0 24 24"><path d="M4 2.5l15.5 9.2-6.6 1.6 3.8 7.1-3 1.6-3.8-7.2-4.9 4.6z" fill="#FFFFFF" stroke="#111113" stroke-width="1.4" stroke-linejoin="round"/></svg><svg class="bub" viewBox="0 0 28 28"><path d="M3 25V14a11 11 0 1 1 11 11Z" fill="#ececee" stroke="#111113" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
      <div class="keycap" id="keycap">⌘V</div>
    </div>
    <div id="final"></div>
    <div id="veil"></div>
    <div id="stepT"><div class="k" id="stepK"></div><div class="m" id="stepM"></div></div>
  </div>
</main>

<script src="../../kit/motion.js"></script>
<script src="../../kit/player.js"></script>
<script>
(() => {
const $ = (s) => document.querySelector(s);
const { clamp, lerp, E, P, el, op, tr, spring, impact, keyAt } = window.Motion;
const fade = (t, a, b, c, d) => P(t, a, b, E.out) * (1 - P(t, c, d, E.in)); // in over a..b, out over c..d
const r2 = (x) => Math.round(x * 100) / 100;

/* ── the comment loop, the film's spine: point at it, Enter, Claude picks it up by itself, and the change appears ──
 * L is when the camera has pushed in on the target; ty how long the comment takes to type; linger how long the
 * sent badge holds before the camera pulls back to show the chat (the first loop lingers so it reads).
 * send is when the note lands in Claude's chat; resolve when Claude marks it done and the count clears. */
function loop(L, ty, linger = 0) {
  const o = { L, push: [L - .6, L], click: L + .3, type: [L + .6, L + .6 + ty] };
  o.enter = r2(o.type[1] + .2);
  o.pull = [r2(o.enter + .35 + linger), r2(o.enter + .95 + linger)];
  o.send = r2(o.enter + .55 + linger); o.work = r2(o.send + .25); o.reply = r2(o.send + 1.3); o.apply = r2(o.reply + .2); o.resolve = r2(o.apply + .6);
  return o;
}

function makeFilm(parent) {

  const q = (s) => f.querySelector(s);
  const F = { head: q('.f-head'), words: [...f.querySelectorAll('.f-head span')], ball: q('.f-ball'), sh: q('.f-shadow'), ring: q('.f-ring'), tile: q('.f-tile'), pill: q('.f-pill'), tri: q('.f-tri') };
  function ballAt(u, soft) {
    const L = lands(soft);
    if (u < 1.2) return { x: 300, y: TOP - 40, sq: 0 };
    const xs = [[1.2, 300], [L[0], 470], [L[1], 540]];
    let x = 540; for (let k = 0; k < 2; k++) if (u < xs[k + 1][0]) { x = lerp(xs[k][1], xs[k + 1][1], (u - xs[k][0]) / (xs[k + 1][0] - xs[k][0])); break; }

    else for (let k = 0; k < 2; k++) if (u >= L[k] && u < L[k + 1]) { const d = L[k + 1] - L[k], v = G0 * d / 2, s = u - L[k]; y = FLOOR - (v * s - .5 * G0 * s * s); }

  tabEls.forEach((n, j) => { const p = spring(t - B.tabs - j * .07); n.style.opacity = clamp(p * 2); n.style.transform = `translateY(${(1 - p) * 14}px)`; });
  op($('#crumbs'), P(t, B.tabs + .3, B.tabs + .7)); op($('#cbtn'), P(t, B.tabs + .4, B.tabs + .8));
  const TAB_AT = [[B.vibeTab, 0], [B.treatTab, 1], [B.editTab, 2], [B.exportTab, 3]];
  let ti = -1, prev = -1, since = 0; TAB_AT.forEach(([a, i]) => { if (t >= a) { prev = ti; ti = i; since = t - a; } });
  tabEls.forEach((n, j) => n.classList.toggle('on', j === ti));
  const ul = $('#uline'); op(ul, ti >= 0 ? 1 : 0);
  if (ti >= 0) { const m = P(since, 0, .3), A = TABS[prev >= 0 ? prev : ti], Bt = TABS[ti]; ul.style.left = lerp(A[1], Bt[1], m) + 'px'; ul.style.width = lerp(A[2], Bt[2], m) + 'px'; }
  $('#cbtn').classList.toggle('on', commenting(t));
  // the link to Claude lights when Claude opens the studio; the count is comments with Claude, cleared as each is done
  const lk = $('#slink'), lp0 = spring(t - B.linked);
  op(lk, P(t, B.tabs + .4, B.tabs + .8)); lk.style.color = t >= B.linked ? Motion.mix('#3ccf7f', '#ececee', P(t, B.linked + .8, B.linked + 1.6)) : '#5c5c63';
  lk.style.transform = `scale(${t >= B.linked ? lerp(1.35, 1, clamp(lp0)) : 1})`;
  op($('#chev'), P(t, B.tabs + .5, B.tabs + .9));
  const withClaude = LOOPS.filter((l) => t >= l.b.send && t < l.b.resolve).length, chN = $("#chevN");
  chN.style.display = withClaude ? "" : "none"; chN.textContent = withClaude;
  ['vibe', 'treat', 'edit', 'exp'].forEach((k, j) => { const p = j === ti ? P(since, 0, .3, E.out) : 0; op(PANE[k], p); PANE[k].style.transform = `translateY(${(1 - p) * 12}px)`; });

  /* vibe: the screenshot lands; after Claude's reply, the pins it added drop in */
  op($('#vEmpty'), t < B.drop ? 1 : 0);
  const np = spring(t - B.drop); op(shotPin, t >= B.drop ? clamp(np * 2) : 0); shotPin.style.transform = `scale(${lerp(.85, 1, clamp(np))})`;
  PINS.forEach((pin, j) => { const a = B.pins + j * B.pinGap, p = spring(t - a); op(pin.n, t >= a ? clamp(p * 2) : 0); pin.n.style.transform = `translateY(${(1 - p) * -60}px) rotate(${(1 - p) * (j % 2 ? 3 : -3)}deg)`; });

  /* treatment: the heading takes over from the flying title; the beats are there; the second gets rewritten */
  const h1 = $('#tH1'), h1t = titleText(STEPS[2]); if (h1.textContent !== h1t) h1.textContent = h1t; // Step 2's title is the treatment's heading
  op(h1, t >= B.fly[1] ? 1 : 0);
  TROWS.forEach((r, j) => {
    const p = P(t, B.rows + j * .12, B.rows + j * .12 + .45, E.out); op(r.n, t >= B.rows + j * .12 ? 1 : 0);
    r.n.querySelector('.t').style.opacity = p; r.fr.style.opacity = p;
    if (j === 1) {
      const re = t >= B.rewrite[0];
      r.h3.textContent = re ? BEAT2.after[0] : BEAT2.before[0];
      r.pp.textContent = re ? typed(BEAT2.after[1], t, B.rewrite[0], B.rewrite[1]) : BEAT2.before[1];
      const hl = fade(t, B.l2.click, B.l2.click + .15, B.l2.send, B.l2.send + .3) + fade(t, B.rewrite[0], B.rewrite[0] + .15, B.rewrite[1] + 1.2, B.rewrite[1] + 1.6);
      r.n.style.background = `rgba(255,255,255,${.06 * clamp(hl)})`;
      // before Claude's edit the frame shows the one landing; after, it plays the three
      r.film.render(re && t >= B.rewrite[1] ? 1.9 + ((t - B.rewrite[1]) % 2.2) : r.u, { ring: re });
      r.fr.style.boxShadow = re ? `0 0 0 ${2 * fade(t, B.rewrite[0], B.rewrite[0] + .2, B.rewrite[1] + 1.2, B.rewrite[1] + 1.6)}px #3ccf7f` : '';
    } else { r.film.render(r.u); r.n.style.background = ''; }
  });

  /* edit: the panes assemble */
  const bp = (d) => P(t, B.build + d, B.build + d + .45, E.out);
  $('#lib').style.transform = `translateX(${(1 - bp(0)) * -290}px)`; $('#insp').style.transform = `translateX(${(1 - bp(.25)) * 310}px)`;
  $('#prev').style.opacity = bp(.1); $('#tl').style.transform = `translateY(${(1 - bp(.15)) * 380}px)`;
  const open = P(t, B.famOpen, B.famOpen + .3, E.out);
  famEls.forEach((n, j) => { const p = P(t, B.build + .2 + j * .04, B.build + .55 + j * .04, E.out); n.style.top = 160 + j * 32 + (j > 2 ? open * 6 * 30 : 0) + 'px'; n.style.opacity = p; n.querySelector('i').style.transform = j === 2 ? `rotate(${open * 90}deg)` : ''; });
  SROWS.forEach((n, j) => { const p = P(t, B.famOpen + .04 * j, B.famOpen + .25 + .04 * j, E.out); n.style.top = 160 + 3 * 32 + j * 30 + 'px'; op(n, p); n.style.transform = `translateX(${(1 - p) * -12}px)`; n.classList.toggle('hot', j === 0 && t >= B.grabRow - .3 && t < B.clipDrop); });

  /* the timeline: rows; the ball's object area opens when Claude links the sound to it */
  const objOpen = P(t, B.objOpen[0], B.objOpen[1]), shift = objOpen * 130;
  const place = (n, y, h, d) => { const p = P(t, B.build + .3 + d, B.build + .7 + d, E.out); n.style.top = y + 'px'; n.style.height = h + 'px'; n.style.opacity = p; };
  place(ruler, 0, 32, 0); place(beats, 32, 26, .04); place(objs, 58, 30, .08);
  tracks.forEach((n, j) => place(n, 88 + shift + j * 40, 40, .12 + j * .04));
  [[objH, 88, 24], [graph, 112, 70], [lane, 182, 36]].forEach(([n, y, h]) => { n.style.top = y + 'px'; n.style.height = h + 'px'; op(n, objOpen); });
  const soft = P(t, B.l3.apply, B.l3.apply + .45), L = lands(soft);
  drawGraph(soft, P(t, B.graph[0], B.graph[1], E.lin));
  marks.forEach((m, j) => { const p = spring(t - B.marks[j]); op(m, t >= B.marks[j] ? clamp(p * 2) : 0); m.style.left = TLX(L[j] - .02) + 'px'; m.style.top = 70 - 8 - [1, .72, .48 * (1 - .35 * soft)][j] * 52 + 'px'; m.style.transform = `scale(${clamp(p)})`; });
  // the clip dragged from the library; then Claude moves it to the ball's lane, one on each landing
  op(dropped, t >= B.drag[0] && t < B.snaps[0] - B.flyDur ? 1 : 0);
  dropped.classList.toggle('fly', t < B.clipDrop);
  if (t >= B.drag[0] && t < B.clipDrop) {
    const cu = cursorAt(t), o = W(290, 64 + 456 + 88 + 40);
    dropped.style.transform = `translate(${(cu.x - o.x) / ST.s - 30 - TLX(2.1)}px,${(cu.y - o.y) / ST.s - 20}px) scale(${lerp(.9, 1, P(t, B.drag[0], B.drag[1]))})`;
  } else dropped.style.transform = `translateY(${impact(t - B.clipDrop) * .6}px)`;
  laneClips.forEach((cl, j) => {
    const land = B.snaps[j], a = land - B.flyDur, p = P(t, a, land, E.io), target = TLX(L[j] - BOUNCE.hit), fromX = TLX(2.1), fromY = 88 + shift + 40 - 182;
    op(cl, t >= a ? 1 : 0); cl.style.left = target + 'px';
    cl.style.transform = p < 1 ? `translate(${(fromX - target) * (1 - p)}px,${fromY * (1 - p) - Math.sin(Math.PI * p) * 40}px)` : `translateY(${impact(t - land) * .5}px)`;
    cl.classList.toggle('fly', p < 1); cl.style.borderColor = t >= land && t < land + .3 ? 'var(--warn)' : '';
  });
  guides.forEach((gd, j) => { op(gd, fade(t, B.snaps[j] - .3, B.snaps[j], B.snaps[j] + .4, B.snaps[j] + .7)); gd.style.left = TLX(L[j]) + 'px'; gd.style.top = '112px'; gd.style.height = '106px'; });

  /* the preview: paused at the last landing for the comment, or playing */
  const plays = [[B.play1, 0, 4.5], [B.replay, 1.9, 4.5], [B.play2, 0, 4.5]];
  let u = 0, playing = false;
  for (const [[a, b], u0, u1] of plays) if (t >= a) { u = t < b ? lerp(u0, u1, (t - a) / (b - a)) : u1; playing = t < b; }
  if (t >= B.play1[1] && t < B.replay[0]) u = 3.5; // parked at the last landing, where the comment is
  prevFilm.render(u, { soft, ring: playing && t >= B.play2[0] });
  $('#clock').textContent = `0:${u.toFixed(2).padStart(5, '0')}`;
  playhead.style.left = TLX(u) + 'px'; op(playhead, P(t, B.build + .4, B.build + .8));
  setInsp(t >= B.objOpen[0] && t < B.s5.in ? 'ball' : 'params');
  const clk = insp.querySelector('.clk'); if (clk) clk.textContent = `0:${u.toFixed(1).padStart(4, '0')}`;

  /* comment mode: the picker frames what is pointed at; the box, then the copied badges */
  let lp = null; LOOPS.forEach((l) => { if (t >= l.b.click - .3 && t < l.b.enter + .9) lp = l; });
  const frozen = lp && t >= lp.b.click;
  op(pick, lp && commenting(t) ? 1 : 0);
  if (lp) {
    const bx = lp.box || { x: lp.at.x - 36, y: lp.at.y - 36, w: 72, h: 72 };
    Object.assign(pick.style, { left: bx.x + 'px', top: bx.y + 'px', width: bx.w + 'px', height: bx.h + 'px', borderWidth: frozen ? '3px' : '2px' }); pickTag.textContent = lp.tag;
  }
  let cl = null; LOOPS.forEach((l) => { if (t >= l.b.click + .05 && t < l.b.enter + 2.6) cl = l; });
  op(cbox, cl ? 1 : 0);
  if (cl) {
    const b = cl.b, cp = spring(t - b.click - .05), bx = cl.box || { x: cl.at.x - 36, y: cl.at.y - 36, w: 72, h: 72 };
    // beside what it is about, or under it in the preview, so the box never covers the thing it comments on
    let x = bx.x + bx.w + 16, y = bx.y;
    if (cl.tab === 'edit' && !cl.box) { x = bx.x - 40; y = bx.y + bx.h + 14; }
    if (x + 340 > 1590) x = bx.x - 356; if (y + 200 > 890) y = 890 - 200;
    cbox.style.left = x + 'px'; cbox.style.top = y + 'px';
    cbox.style.transform = `scale(${lerp(.9, 1, clamp(cp))})`; cbox.style.transformOrigin = '0 0';
    cbT.textContent = cl.title;
    const copied = t >= b.enter, key = (copied ? 'c' : 't') + LOOPS.indexOf(cl);
    if (cbBody.dataset.k !== key) {
      cbBody.dataset.k = key;
      cbBody.innerHTML = copied ? `<div style="display:grid;gap:8px"><span class="badge ok"><svg viewBox="0 0 16 16" width="16" height="16"><path class="tick" d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="16"/></svg>Sent to Claude</span><span class="hint next">The change shows here once Claude has made it.</span><div class="lbar"><i></i></div></div>`
        : `<div class="ta"></div><div class="hint">Enter sends it to Claude · ⌘Enter queues it · Esc cancels</div>`;
    }
    if (!copied) { const ta = cbBody.querySelector('.ta'); ta.textContent = typed(cl.text, t, b.type[0], b.type[1]); el('span', 'caret', null, ta).style.opacity = Math.floor(t * 2.6) % 2 ? 1 : .2; }
    else {
      const e = t - b.enter, b1 = cbBody.querySelector('.ok'), b2 = cbBody.querySelector('.next');
      const p1 = P(e, 0, .42, E.back); b1.style.opacity = clamp(p1 * 2); b1.style.transform = `scale(${lerp(.6, 1, p1)})`;
      cbBody.querySelector('.tick').style.strokeDashoffset = 16 * (1 - P(e, .18, .5, E.out));
      const p2 = P(e, .35, .65, E.out);
      b2.style.opacity = p2; b2.style.transform = `translateY(${(1 - p2) * -6}px)`;
      cbBody.querySelector('.lbar i').style.transform = `scaleX(${1 - clamp(e / 2.6)})`;
    }
  }

  /* export: the check, back in step after Claude's reply; then the render */
  const fixed = t >= B.l5.apply, xk = fixed ? 'ok' : 'warn';
  if (xNote.dataset.k !== xk) { xNote.innerHTML = DRIFT[xk]; xNote.dataset.k = xk; }
  xNote.style.transform = `scale(${lerp(.96, 1, clamp(fixed ? spring(t - B.l5.apply) : 1))})`;
  const prog = clamp((t - B.progress[0]) / (B.progress[1] - B.progress[0])), done = t >= B.shutter, jk = t < B.progress[0] ? 'none' : done ? 'done' : 'run';
  if (xJobs.dataset.k !== jk) { xJobs.dataset.k = jk; xJobs.innerHTML = jk === 'none' ? '<div style="color:var(--mu)">Nothing rendered in this session yet.</div>' : `<div style="display:flex;justify-content:space-between;font-size:15px"><b style="font-weight:600">hello.mp4</b><span id="xSt" style="color:var(--mu)"></span></div><div class="prog" style="margin-top:12px"><i></i></div>${jk === 'done' ? '<div style="margin-top:14px;display:flex;gap:8px"><span class="btn">Show in folder</span><span class="btn pri">Open</span></div>' : ''}`; }
  if (jk !== 'none') { xJobs.querySelector('.prog i').style.transform = `scaleX(${done ? 1 : prog})`; xJobs.querySelector('#xSt').textContent = done ? 'Done' : `${prog < .8 ? 'capture' : 'encode'} · ${Math.round(prog * 100)}%`; }
  $('#xStatus').textContent = t >= B.render && t < B.progress[0] + .3 ? 'Starting…' : '';
}

function drawChat(t) {
  MSG.forEach((m) => {
    m.n.style.display = t >= m.at ? '' : 'none';
    if (m.w) { const w = t >= m.work && t < m.at; m.w.style.display = w ? '' : 'none'; if (w) m.w.querySelector('svg').style.transform = `rotate(${(t - m.work) * 240}deg)`; }
    const p = spring(t - m.at); m.n.style.opacity = clamp(p * 2); m.n.style.transform = `translateY(${(1 - p) * 24}px) scale(${lerp(.94, 1, clamp(p))})`; m.n.style.transformOrigin = m.k === 'u' ? '100% 100%' : '0 100%';
  });
  let txt = null;
  if (t >= B.l5.type[0] && t < B.l5.send) txt = typed(ASK, t, B.l5.type[0], B.l5.type[1]);
  if (txt !== null) { chTx.textContent = txt; el('span', 'ccaret', null, chTx).style.opacity = Math.floor(t * 2.6) % 2 ? 1 : .2; }
  else chTx.innerHTML = '<span class="ph">Reply to Claude…</span>';
}

/* ── sound moments (the sound pass comes after the motion is approved) ── */
{
  const M = Motion.moment;
  STEPS.forEach((st, i) => { M(`title-${i}-in`, { t: st.b.in, host: stepT, label: `Title ${i} lands` }); if (!st.last && !st.fly) M(`title-${i}-out`, { t: st.b.out, dur: .42, host: stepT, label: `Title ${i} swishes out` }); });
  M('title-2-fly', { t: B.fly[0], dur: B.fly[1] - B.fly[0], host: stepT, label: 'Step 2 flies into the treatment' });
  M('windows-in', { t: B.rise, dur: .8, host: [studio, chat], label: 'The studio and the chat rise in' });
  M('clicks', { times: CLICKS, host: curEl, label: 'Pointer clicks' });
  M('file-drop', { t: B.drop, host: shotPin, label: 'The screenshot lands on the board' });
  M('pins-in', { times: PINS.map((_, j) => B.pins + j * B.pinGap), host: PINS.map((p) => p.n), label: "Claude's pins drop onto the board" });
  M('beat-rewritten', { t: B.rewrite[0], dur: B.rewrite[1] - B.rewrite[0], host: TROWS[1].n, label: 'Claude rewrites the beat' });
  M('clip-drop', { t: B.clipDrop, host: dropped, label: 'The bounce lands on Track 2' });
  M('snaps', { times: B.snaps, host: laneClips, label: 'A bounce snaps to each landing' });
  LOOPS.forEach((l, j) => {
    M(`l${j + 1}-type`, { t: l.b.type[0], dur: l.b.type[1] - l.b.type[0], host: cbox, label: `Comment ${j + 1} typed` });
    M(`l${j + 1}-copied`, { t: l.b.enter, host: cbox, label: `Comment ${j + 1} copied` });
    M(`l${j + 1}-arrives`, { t: l.b.send, host: chat, label: `Note ${j + 1} arrives in Claude's chat` });
    M(`l${j + 1}-reply`, { t: l.b.reply, host: chat, label: `Claude's reply ${j + 1}` });
  });
  M('ask-typed', { t: B.l5.type[0], dur: B.l5.type[1] - B.l5.type[0], host: chat, label: 'The request is typed' });
  M('in-step', { t: B.l5.apply, host: xNote, label: 'Back in step with the app' });
  M('shutter', { t: B.shutter, host: xJobs, label: 'The render finishes' });
  M('grow', { t: B.grow[0], dur: B.grow[1] - B.grow[0], host: finalEl, label: 'The finished film fills the frame' });
}

Object.assign(window.__film = window.__film || {}, { B, camAt, draw });
Motion.mountPlayer({ duration: DUR, poster: B.l1.reply + .4, scenes: SCENES, keys: KEYS, render });
})();
</script>
